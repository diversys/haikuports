name: Build and Deploy Haiku Repo

on:
  push:
    branches: [master]
    paths:
      - 'r1beta6/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Haiku VM
        uses: cross-platform-actions/action@v1.5.0
        with:
          operating_system: haiku
          version: r1beta6
          architecture: x86-64

      # ---------- x86_64: fix vendor + generate repo ----------
      - name: Generate x86_64 repo (fix vendor)
        shell: cpa.sh {0}
        run: |
          cd /boot/home/home/runner/work/haikuports/haikuports/r1beta6/x86_64
          EXPECTED_VENDOR="Diver"

          for pkg in packages/*.hpkg; do
            [ -f "$pkg" ] || continue
            package extract -i /tmp/pkg_info.txt "$pkg"
            CURRENT_VENDOR=$(grep -E '^\s*vendor\s' /tmp/pkg_info.txt | sed -E 's/^\s*vendor\s+"?([^"]+)"?/\1/')
            if [ "$CURRENT_VENDOR" != "$EXPECTED_VENDOR" ]; then
              PKG_PATH="$(pwd)/$pkg"
              TMPDIR="/tmp/repack-$$"
              mkdir -p "$TMPDIR"
              package extract -C "$TMPDIR" "$pkg"
              sed -i "s/^\s*vendor\s.*/vendor \"$EXPECTED_VENDOR\"/" "$TMPDIR/.PackageInfo"
              package create -C "$TMPDIR" "$PKG_PATH"
              rm -rf "$TMPDIR"
            fi
          done

          # Collect explicit list of .hpkg files (shell may not expand globs in cpa.sh)
          PKG_FILES=$(find packages -name '*.hpkg' -type f)
          if [ -z "$PKG_FILES" ]; then
            echo "No .hpkg files found in packages/"
            exit 1
          fi

          rm -f repo
          package_repo create repo.info $PKG_FILES
          find packages -name '*.hpkg' -type f | sed -E 's|packages/||; s/-[0-9]+\.[0-9]+\.[0-9]+-.*//' > packages.txt

      # ---------- ARM64: generate repo ----------
      - name: Generate ARM64 repo
        shell: cpa.sh {0}
        run: |
          cd /boot/home/home/runner/work/haikuports/haikuports/r1beta6/arm64
          EXPECTED_VENDOR="Diver"

          for pkg in packages/*.hpkg; do
            [ -f "$pkg" ] || continue
            package extract -i /tmp/pkg_info.txt "$pkg"
            CURRENT_VENDOR=$(grep -E '^\s*vendor\s' /tmp/pkg_info.txt | sed -E 's/^\s*vendor\s+"?([^"]+)"?/\1/')
            if [ "$CURRENT_VENDOR" != "$EXPECTED_VENDOR" ]; then
              PKG_PATH="$(pwd)/$pkg"
              TMPDIR="/tmp/repack-$$"
              mkdir -p "$TMPDIR"
              package extract -C "$TMPDIR" "$pkg"
              sed -i "s/^\s*vendor\s.*/vendor \"$EXPECTED_VENDOR\"/" "$TMPDIR/.PackageInfo"
              package create -C "$TMPDIR" "$PKG_PATH"
              rm -rf "$TMPDIR"
            fi
          done

          PKG_FILES=$(find packages -name '*.hpkg' -type f)
          if [ -z "$PKG_FILES" ]; then
            echo "No .hpkg files found in packages/"
            exit 1
          fi

          rm -f repo
          package_repo create repo.info $PKG_FILES
          find packages -name '*.hpkg' -type f | sed -E 's|packages/||; s/-[0-9]+\.[0-9]+\.[0-9]+-.*//' > packages.txt

      - name: Generate repo.sha256 for both architectures
        run: |
          cd r1beta6/x86_64 && sha256sum repo > repo.sha256 && cd ../..
          cd r1beta6/arm64 && sha256sum repo > repo.sha256 && cd ../..

      - name: Generate Directory Listings
        uses: jayanta525/github-pages-directory-listing@v4.0.0
        with:
          FOLDER: .

      - name: Remove generator footer from listings
        run: |
          find . -name 'index.html' -exec sed -i '/generated with github-pages-directory-listing/d' {} +

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
